<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <linearGradient id="box-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131b2e"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <rect x="0" y="0" width="900" height="360" fill="#060911" rx="8"/>

  <!-- Block 1: Audio Hardware Layer (Shure Nodes) -->
  <rect x="30" y="50" width="220" height="260" rx="10" fill="url(#box-grad)" stroke="#10b981" stroke-width="1.5"/>
  <rect x="50" y="70" width="180" height="30" rx="6" fill="#10b981"/>
  <text x="140" y="90" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Networked Audio Fleet</text>
  <text x="50" y="130" fill="#94a3b8" font-size="11">• Shure Axient Digital AD4Q</text>
  <text x="50" y="155" fill="#94a3b8" font-size="11">• Shure MXA920 Array</text>
  <text x="50" y="180" fill="#94a3b8" font-size="11">• Shure SLX-D Digital</text>
  <text x="50" y="205" fill="#94a3b8" font-size="11">• RF, VU, Dante &amp; FFT</text>
  <rect x="50" y="240" width="180" height="40" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981"/>
  <text x="140" y="265" fill="#10b981" font-size="11" font-weight="700" text-anchor="middle">Physics Simulator Engine</text>

  <!-- Arrow 1 -->
  <path d="M 250 180 L 330 180" stroke="#0ea5e9" stroke-width="2"/>
  <text x="290" y="170" fill="#0ea5e9" font-size="10" text-anchor="middle">WebSocket (4Hz)</text>

  <!-- Block 2: FastAPI & AI Diagnostics -->
  <rect x="330" y="50" width="240" height="260" rx="10" fill="url(#box-grad)" stroke="#0ea5e9" stroke-width="1.5"/>
  <rect x="350" y="70" width="200" height="30" rx="6" fill="#0ea5e9"/>
  <text x="450" y="90" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">FastAPI Diagnostic Engine</text>
  <text x="350" y="130" fill="#94a3b8" font-size="11">• WebSocket Telemetry Hub</text>
  <text x="350" y="155" fill="#94a3b8" font-size="11">• Anomaly Detection Rules</text>
  <text x="350" y="180" fill="#94a3b8" font-size="11">• Frequency Coordinator</text>
  <text x="350" y="205" fill="#94a3b8" font-size="11">• SQLAlchemy ORM Models</text>
  <rect x="350" y="240" width="200" height="40" rx="6" fill="rgba(14, 165, 233, 0.15)" stroke="#0ea5e9"/>
  <text x="450" y="265" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Automated Remediation</text>

  <!-- Arrow 2 -->
  <path d="M 570 180 L 650 180" stroke="#10b981" stroke-width="2"/>
  <text x="610" y="170" fill="#10b981" font-size="10" text-anchor="middle">REST / WS</text>

  <!-- Block 3: React 19 Frontend Dashboard -->
  <rect x="650" y="50" width="220" height="260" rx="10" fill="url(#box-grad)" stroke="#10b981" stroke-width="1.5"/>
  <rect x="670" y="70" width="180" height="30" rx="6" fill="#10b981"/>
  <text x="760" y="90" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">React 19 Audio Console</text>
  <text x="670" y="130" fill="#94a3b8" font-size="11">• 60fps HTML5 Canvas FFT</text>
  <text x="670" y="155" fill="#94a3b8" font-size="11">• Real-time VU dBFS Meter</text>
  <text x="670" y="180" fill="#94a3b8" font-size="11">• RF Signal RSSI Gauges</text>
  <text x="670" y="205" fill="#94a3b8" font-size="11">• One-Click AI Remediation</text>
  <rect x="670" y="240" width="180" height="40" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981"/>
  <text x="760" y="265" fill="#10b981" font-size="11" font-weight="700" text-anchor="middle">Live Operator Controls</text>
</svg>
