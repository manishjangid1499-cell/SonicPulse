<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%">
  <defs>
    <filter id="shadow-diag" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Container -->
  <rect x="15" y="15" width="970" height="350" rx="10" fill="#090d16" stroke="#26334d" stroke-width="1.5" filter="url(#shadow-diag)"/>

  <!-- Card 1: Anomaly Manifestation -->
  <rect x="35" y="40" width="280" height="295" rx="8" fill="#131b2e" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="50" y="55" width="110" height="20" rx="4" fill="rgba(239, 68, 68, 0.2)"/>
  <text x="105" y="69" fill="#ef4444" font-size="10" font-weight="800" text-anchor="middle">CRITICAL ALERT</text>
  <text x="50" y="100" fill="#f8fafc" font-size="13" font-weight="700">RF Carrier Collapse</text>
  <text x="50" y="118" fill="#64748b" font-size="11">Lead Vocal • Axient AD4Q Ch 1</text>

  <rect x="50" y="135" width="250" height="50" rx="6" fill="#090d16" stroke="#26334d"/>
  <text x="62" y="153" fill="#64748b" font-size="9" font-weight="700">MEASURED RF RSSI</text>
  <text x="62" y="174" fill="#ef4444" font-size="16" font-weight="800" class="mono">-86.4 dBm (CRITICAL FADE)</text>

  <rect x="50" y="195" width="250" height="50" rx="6" fill="#090d16" stroke="#26334d"/>
  <text x="62" y="213" fill="#64748b" font-size="9" font-weight="700">MEASURED CARRIER SNR</text>
  <text x="62" y="234" fill="#ef4444" font-size="16" font-weight="800" class="mono">8.2 dB (DROP IMMINENT)</text>

  <text x="50" y="275" fill="#f87171" font-size="11">• LTE-A tower interference detected</text>
  <text x="50" y="295" fill="#f87171" font-size="11">• Severe phase cancellation on antenna A/B</text>

  <!-- Arrow 1 -->
  <path d="M 325 187 L 355 187" stroke="#0ea5e9" stroke-width="2"/>
  <text x="340" y="177" fill="#0ea5e9" font-size="10" text-anchor="middle">4Hz WS</text>

  <!-- Card 2: AI Root Cause Analysis -->
  <rect x="365" y="40" width="310" height="295" rx="8" fill="#131b2e" stroke="#0ea5e9" stroke-width="1.5"/>
  <rect x="380" y="55" width="130" height="20" rx="4" fill="rgba(14, 165, 233, 0.2)"/>
  <text x="445" y="69" fill="#0ea5e9" font-size="10" font-weight="800" text-anchor="middle">AI DIAGNOSTIC ENGINE</text>
  <text x="660" y="69" fill="#10b981" font-size="10" font-weight="700" text-anchor="end">Confidence: 96%</text>

  <text x="380" y="100" fill="#f8fafc" font-size="13" font-weight="700">Root-Cause Spectrum Audit</text>
  <text x="380" y="122" fill="#94a3b8" font-size="11">External LTE downlink carrier intermodulation</text>
  <text x="380" y="138" fill="#94a3b8" font-size="11">at 518.250 MHz caused severe SNR collapse.</text>
  <text x="380" y="154" fill="#94a3b8" font-size="11">PTP sync intact, but audio drop risk is 98%.</text>

  <rect x="380" y="175" width="280" height="60" rx="6" fill="#0c1424" stroke="#0ea5e9"/>
  <text x="392" y="195" fill="#7dd3fc" font-size="10" font-weight="700">FREQUENCY COORDINATION SOLUTION:</text>
  <text x="392" y="212" fill="#f8fafc" font-size="11">Clear Intermod-Free Backup Channel:</text>
  <text x="392" y="228" fill="#38bdf8" font-size="12" font-weight="800" class="mono">548.750 MHz (TV Ch 27 Guard Band)</text>

  <text x="380" y="260" fill="#64748b" font-size="11">Automated scan calculated 36 dB headroom.</text>

  <!-- Arrow 2 -->
  <path d="M 685 187 L 715 187" stroke="#10b981" stroke-width="2"/>
  <text x="700" y="177" fill="#10b981" font-size="10" text-anchor="middle">Remediate</text>

  <!-- Card 3: One-Click Automated Healing -->
  <rect x="725" y="40" width="240" height="295" rx="8" fill="#131b2e" stroke="#10b981" stroke-width="1.5"/>
  <rect x="740" y="55" width="130" height="20" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
  <text x="805" y="69" fill="#10b981" font-size="10" font-weight="800" text-anchor="middle">SUB-100MS HEALING</text>
  
  <text x="740" y="100" fill="#f8fafc" font-size="13" font-weight="700">Self-Healing Execution</text>
  <text x="740" y="122" fill="#94a3b8" font-size="11">One-click hardware command sent</text>
  <text x="740" y="138" fill="#94a3b8" font-size="11">via REST API to receiver PLL synthesizer.</text>

  <rect x="740" y="165" width="210" height="42" rx="6" fill="#10b981"/>
  <text x="845" y="191" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">⚡ Auto-Tune: 548.750 MHz</text>

  <rect x="740" y="225" width="210" height="85" rx="6" fill="#090d16" stroke="#10b981"/>
  <text x="752" y="245" fill="#10b981" font-size="11" font-weight="700">✓ POST-HEALING METRICS:</text>
  <text x="752" y="265" fill="#38bdf8" font-size="11" class="mono">RSSI: -48.2 dBm (EXCELLENT)</text>
  <text x="752" y="283" fill="#10b981" font-size="11" class="mono">SNR: 34.1 dB (ZERO DROPOUTS)</text>
  <text x="752" y="300" fill="#f8fafc" font-size="10">Channel restored to nominal state.</text>
</svg>
