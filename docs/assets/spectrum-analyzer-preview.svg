<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%">
  <defs>
    <linearGradient id="spectrum-bar-grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="85%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="vu-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="88%" stop-color="#f59e0b"/>
      <stop offset="96%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow-spec" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Container Box -->
  <rect x="15" y="15" width="970" height="420" rx="10" fill="#0b1120" stroke="#26334d" stroke-width="1.5" filter="url(#shadow-spec)"/>

  <!-- Header Bar -->
  <rect x="15" y="15" width="970" height="46" rx="10" fill="#131b2e"/>
  <circle cx="38" cy="38" r="5" fill="#ef4444"/>
  <circle cx="54" cy="38" r="5" fill="#f59e0b"/>
  <circle cx="70" cy="38" r="5" fill="#10b981"/>
  <text x="100" y="42" fill="#f8fafc" font-size="13" font-weight="700">Shure Axient Digital AD4Q • Live 16-Band FFT Audio Spectrum &amp; Oscilloscope</text>
  <text x="960" y="42" fill="#64748b" font-size="11" text-anchor="end">Dante 48 kHz / 24-bit • PTP v2 Jitter: 0.25 ms</text>

  <!-- Oscilloscope & FFT Canvas Frame -->
  <rect x="35" y="75" width="930" height="230" rx="8" fill="#060911" stroke="#1e293b"/>

  <!-- Frequency Grid Lines -->
  <line x1="35" y1="130" x2="965" y2="130" stroke="#1e293b" stroke-dasharray="4"/>
  <line x1="35" y1="185" x2="965" y2="185" stroke="#1e293b" stroke-dasharray="4"/>
  <line x1="35" y1="240" x2="965" y2="240" stroke="#1e293b" stroke-dasharray="4"/>

  <!-- 16 FFT Spectrum Bars -->
  <rect x="60" y="210" width="42" height="80" fill="url(#spectrum-bar-grad)" rx="3"/>
  <rect x="115" y="175" width="42" height="115" fill="url(#spectrum-bar-grad)" rx="3"/>
  <rect x="170" y="140" width="42" height="150" fill="url(#spectrum-bar-grad)" rx="3"/>
  <rect x="225" y="120" width="42" height="170" fill="url(#spectrum-bar-grad)" rx="3"/>
  <rect x="280" y="105" width="42" height="185" fill="url(#spectrum-bar-grad)" rx="3"/>
  <rect x="335" y="130" width="42" height="160" fill="url(#spectrum-bar-grad)" rx="3"/>
  <rect x="390" y="150" width="42" height="140" fill="url(#spectrum-bar-grad)" rx="3"/>
  <rect x="445" y="165" width="42" height="125" fill="url(#spectrum-bar-grad)" rx="3"/>
  <rect x="500" y="145" width="42" height="145" fill="url(#spectrum-bar-grad)" rx="3"/>
  <rect x="555" y="135" width="42" height="155" fill="url(#spectrum-bar-grad)" rx="3"/>
  <rect x="610" y="180" width="42" height="110" fill="url(#spectrum-bar-grad)" rx="3"/>
  <rect x="665" y="200" width="42" height="90" fill="url(#spectrum-bar-grad)" rx="3"/>
  <rect x="720" y="220" width="42" height="70" fill="url(#spectrum-bar-grad)" rx="3"/>
  <rect x="775" y="235" width="42" height="55" fill="url(#spectrum-bar-grad)" rx="3"/>
  <rect x="830" y="245" width="42" height="45" fill="url(#spectrum-bar-grad)" rx="3"/>
  <rect x="885" y="255" width="42" height="35" fill="url(#spectrum-bar-grad)" rx="3"/>

  <!-- Real-time Sine Oscilloscope Curve -->
  <path d="M 35 190 Q 150 110 270 190 T 510 190 T 750 190 T 965 190" fill="none" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- Frequency Axis Labels -->
  <text x="81" y="322" fill="#64748b" font-size="10" text-anchor="middle" class="mono">50Hz</text>
  <text x="191" y="322" fill="#64748b" font-size="10" text-anchor="middle" class="mono">250Hz</text>
  <text x="356" y="322" fill="#64748b" font-size="10" text-anchor="middle" class="mono">1kHz</text>
  <text x="521" y="322" fill="#64748b" font-size="10" text-anchor="middle" class="mono">4kHz</text>
  <text x="686" y="322" fill="#64748b" font-size="10" text-anchor="middle" class="mono">10kHz</text>
  <text x="906" y="322" fill="#64748b" font-size="10" text-anchor="middle" class="mono">18kHz</text>

  <!-- Multi-Segment LED VU Meter Bar -->
  <text x="35" y="352" fill="#94a3b8" font-size="11" font-weight="700">ANALOG PREAMP PEAK VU METER</text>
  <text x="965" y="352" fill="#10b981" font-size="12" font-weight="800" text-anchor="end" class="mono">-14.2 dBFS (NOMINAL HEADROOM)</text>

  <rect x="35" y="362" width="930" height="14" rx="4" fill="#1e293b"/>
  <rect x="35" y="362" width="670" height="14" rx="4" fill="url(#vu-grad)"/>

  <!-- Meter Scale Ticks -->
  <text x="35" y="394" fill="#64748b" font-size="10" class="mono">-60</text>
  <text x="210" y="394" fill="#64748b" font-size="10" class="mono">-40</text>
  <text x="420" y="394" fill="#64748b" font-size="10" class="mono">-20</text>
  <text x="630" y="394" fill="#64748b" font-size="10" class="mono">-12</text>
  <text x="780" y="394" fill="#f59e0b" font-size="10" class="mono">-6</text>
  <text x="860" y="394" fill="#f59e0b" font-size="10" class="mono">-3</text>
  <text x="940" y="394" fill="#ef4444" font-size="10" font-weight="800" class="mono">0 dBFS (CLIP)</text>

  <text x="35" y="420" fill="#64748b" font-size="11">Crest Factor: 14.8 dB • Dynamic Range: 120 dB • THD+N: &lt; 0.001% • Dante AoIP Latency: 0.25 ms</text>
</svg>
