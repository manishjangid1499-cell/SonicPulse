<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="sp-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="spectrum-grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="sp-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Frame -->
  <rect x="20" y="20" width="1160" height="710" rx="12" fill="#090d16" stroke="#26334d" stroke-width="1.5" filter="url(#sp-shadow)"/>

  <!-- Titlebar -->
  <path d="M 20 32 Q 20 20 32 20 L 1168 20 Q 1180 20 1180 32 L 1180 56 L 20 56 Z" fill="#131b2e"/>
  <circle cx="44" cy="38" r="6" fill="#ef4444"/>
  <circle cx="64" cy="38" r="6" fill="#f59e0b"/>
  <circle cx="84" cy="38" r="6" fill="#10b981"/>
  <text x="600" y="42" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">SonicPulse — Real-Time Networked Audio Device Telemetry &amp; AI Diagnostic Platform</text>

  <!-- Header -->
  <rect x="20" y="56" width="1160" height="58" fill="#131b2e" stroke="#26334d" stroke-width="0.5"/>
  <rect x="40" y="68" width="34" height="34" rx="8" fill="url(#sp-brand)"/>
  <text x="57" y="91" fill="#ffffff" font-size="16" font-weight="900" text-anchor="middle">SP</text>
  
  <text x="86" y="83" fill="#f8fafc" font-size="16" font-weight="700">SonicPulse</text>
  <text x="86" y="97" fill="#64748b" font-size="11">Real-Time Networked Audio Device Telemetry &amp; AI Diagnostics</text>

  <!-- Live Telemetry Pill -->
  <rect x="880" y="70" width="168" height="30" rx="15" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)"/>
  <circle cx="898" cy="85" r="4" fill="#10b981"/>
  <text x="965" y="89" fill="#10b981" font-size="11" font-weight="700" text-anchor="middle">LIVE TELEMETRY (4 HZ)</text>

  <rect x="1060" y="70" width="100" height="30" rx="6" fill="#1e293b"/>
  <text x="1110" y="89" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">Fleet: 4 Nodes</text>

  <!-- Main Left Container -->
  <rect x="20" y="114" width="760" height="616" fill="#090d16"/>

  <!-- Device Cards Grid -->
  <!-- Card 1 (Active) -->
  <rect x="40" y="134" width="340" height="195" rx="10" fill="#131b2e" stroke="#10b981" stroke-width="1.5"/>
  <text x="56" y="158" fill="#f8fafc" font-size="14" font-weight="700">Lead Vocal (Wireless Handheld)</text>
  <text x="56" y="174" fill="#64748b" font-size="11">Shure Axient Digital AD4Q • Dante Ch 1</text>
  <rect x="270" y="146" width="94" height="20" rx="10" fill="rgba(16, 185, 129, 0.2)"/>
  <text x="317" y="160" fill="#10b981" font-size="9" font-weight="800" text-anchor="middle">OPTIMAL</text>

  <!-- Meters Row -->
  <rect x="56" y="186" width="144" height="46" rx="6" fill="#090d16" stroke="#26334d"/>
  <text x="68" y="202" fill="#64748b" font-size="9" font-weight="700">RF SIGNAL (RSSI)</text>
  <text x="68" y="222" fill="#38bdf8" font-size="15" font-weight="800" class="mono">-52.0 dBm</text>

  <rect x="208" y="186" width="156" height="46" rx="6" fill="#090d16" stroke="#26334d"/>
  <text x="220" y="202" fill="#64748b" font-size="9" font-weight="700">AUDIO PEAK (dBFS)</text>
  <text x="220" y="222" fill="#10b981" font-size="15" font-weight="800" class="mono">-14.2 dBFS</text>

  <!-- VU Meter -->
  <text x="56" y="248" fill="#64748b" font-size="9">VU METER</text>
  <text x="330" y="248" fill="#64748b" font-size="9" text-anchor="end">0 dBFS</text>
  <rect x="56" y="254" width="308" height="8" rx="4" fill="#1e293b"/>
  <rect x="56" y="254" width="224" height="8" rx="4" fill="url(#sp-brand)"/>

  <text x="56" y="280" fill="#64748b" font-size="11">Carrier: 518.250 MHz</text>
  <text x="364" y="280" fill="#64748b" font-size="11" text-anchor="end">🔋 Battery: 92% (440m)</text>

  <!-- Card 2 -->
  <rect x="400" y="134" width="360" height="195" rx="10" fill="#131b2e" stroke="#26334d"/>
  <text x="416" y="158" fill="#f8fafc" font-size="14" font-weight="700">Backing Vocal / Guitar</text>
  <text x="416" y="174" fill="#64748b" font-size="11">Shure Axient Digital AD4Q • Dante Ch 2</text>
  <rect x="650" y="146" width="94" height="20" rx="10" fill="rgba(16, 185, 129, 0.2)"/>
  <text x="697" y="160" fill="#10b981" font-size="9" font-weight="800" text-anchor="middle">OPTIMAL</text>

  <rect x="416" y="186" width="154" height="46" rx="6" fill="#090d16" stroke="#26334d"/>
  <text x="428" y="202" fill="#64748b" font-size="9" font-weight="700">RF SIGNAL (RSSI)</text>
  <text x="428" y="222" fill="#38bdf8" font-size="15" font-weight="800" class="mono">-56.4 dBm</text>

  <rect x="578" y="186" width="166" height="46" rx="6" fill="#090d16" stroke="#26334d"/>
  <text x="590" y="202" fill="#64748b" font-size="9" font-weight="700">AUDIO PEAK (dBFS)</text>
  <text x="590" y="222" fill="#10b981" font-size="15" font-weight="800" class="mono">-21.8 dBFS</text>

  <rect x="416" y="254" width="328" height="8" rx="4" fill="#1e293b"/>
  <rect x="416" y="254" width="190" height="8" rx="4" fill="url(#sp-brand)"/>

  <text x="416" y="280" fill="#64748b" font-size="11">Carrier: 522.400 MHz</text>
  <text x="744" y="280" fill="#64748b" font-size="11" text-anchor="end">🔋 Battery: 78% (370m)</text>

  <!-- Live 16-Band FFT Spectrum & Oscilloscope -->
  <rect x="40" y="348" width="720" height="230" rx="10" fill="#131b2e" stroke="#26334d"/>
  <text x="56" y="374" fill="#94a3b8" font-size="12" font-weight="700">LIVE 16-BAND FFT AUDIO SPECTRUM &amp; OSCILLOSCOPE (LEAD VOCAL)</text>
  <text x="740" y="374" fill="#64748b" font-size="10" text-anchor="end">Sampling Rate: 48 kHz / 24-bit • PTP Jitter: 0.25ms</text>

  <rect x="56" y="390" width="688" height="170" rx="6" fill="#060911" stroke="#26334d"/>
  
  <!-- 16 FFT Spectrum Bars -->
  <rect x="70" y="490" width="32" height="60" fill="url(#spectrum-grad)" rx="2"/>
  <rect x="112" y="460" width="32" height="90" fill="url(#spectrum-grad)" rx="2"/>
  <rect x="154" y="440" width="32" height="110" fill="url(#spectrum-grad)" rx="2"/>
  <rect x="196" y="420" width="32" height="130" fill="url(#spectrum-grad)" rx="2"/>
  <rect x="238" y="410" width="32" height="140" fill="url(#spectrum-grad)" rx="2"/>
  <rect x="280" y="430" width="32" height="120" fill="url(#spectrum-grad)" rx="2"/>
  <rect x="322" y="450" width="32" height="100" fill="url(#spectrum-grad)" rx="2"/>
  <rect x="364" y="465" width="32" height="85" fill="url(#spectrum-grad)" rx="2"/>
  <rect x="406" y="445" width="32" height="105" fill="url(#spectrum-grad)" rx="2"/>
  <rect x="448" y="425" width="32" height="125" fill="url(#spectrum-grad)" rx="2"/>
  <rect x="490" y="470" width="32" height="80" fill="url(#spectrum-grad)" rx="2"/>
  <rect x="532" y="490" width="32" height="60" fill="url(#spectrum-grad)" rx="2"/>
  <rect x="574" y="505" width="32" height="45" fill="url(#spectrum-grad)" rx="2"/>
  <rect x="616" y="515" width="32" height="35" fill="url(#spectrum-grad)" rx="2"/>
  <rect x="658" y="525" width="32" height="25" fill="url(#spectrum-grad)" rx="2"/>
  <rect x="700" y="530" width="32" height="20" fill="url(#spectrum-grad)" rx="2"/>

  <!-- Waveform Overlay Sine Curve -->
  <path d="M 56 470 Q 150 420 230 470 T 400 470 T 570 470 T 744 470" fill="none" stroke="#38bdf8" stroke-width="2"/>

  <!-- Simulation Action Bar -->
  <rect x="40" y="592" width="720" height="48" rx="8" fill="#1e293b"/>
  <text x="56" y="621" fill="#64748b" font-size="11" font-weight="700">TEST ANOMALY INJECTION:</text>
  <rect x="220" y="602" width="160" height="28" rx="5" fill="#0f172a" stroke="#26334d"/>
  <text x="300" y="620" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle">⚡ Trigger RF Fading</text>

  <rect x="390" y="602" width="160" height="28" rx="5" fill="#0f172a" stroke="#26334d"/>
  <text x="470" y="620" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle">🚨 Trigger 0 dBFS Clip</text>

  <rect x="560" y="602" width="180" height="28" rx="5" fill="#0f172a" stroke="#26334d"/>
  <text x="650" y="620" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle">🌐 Trigger Dante Jitter</text>

  <!-- Right Sidebar: AI Diagnostic Center -->
  <rect x="780" y="114" width="400" height="616" fill="#131b2e" stroke="#26334d" stroke-width="0.5"/>
  <text x="804" y="146" fill="#f8fafc" font-size="14" font-weight="800">AI DIAGNOSTIC CENTER</text>
  <line x1="780" y1="162" x2="1180" y2="162" stroke="#26334d"/>

  <!-- Report Card 1: Active Warning -->
  <rect x="800" y="180" width="360" height="210" rx="8" fill="#090d16" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="816" y="194" width="126" height="20" rx="4" fill="rgba(245, 158, 11, 0.2)"/>
  <text x="879" y="208" fill="#f59e0b" font-size="10" font-weight="800" text-anchor="middle">RF_INTERFERENCE</text>
  <text x="1144" y="208" fill="#64748b" font-size="10" text-anchor="end">AI Confidence: 96%</text>

  <text x="816" y="234" fill="#f8fafc" font-size="11" font-weight="700">Root Cause Analysis:</text>
  <text x="816" y="250" fill="#94a3b8" font-size="11">Carrier frequency experienced multipath phase</text>
  <text x="816" y="266" fill="#94a3b8" font-size="11">cancellation. RSSI collapsed to -86.4 dBm with</text>
  <text x="816" y="282" fill="#94a3b8" font-size="11">SNR drop to 8.2 dB (critical threshold: 10 dB).</text>

  <rect x="816" y="296" width="328" height="36" rx="4" fill="#0c1424"/>
  <line x1="816" y1="296" x2="816" y2="332" stroke="#0ea5e9" stroke-width="3"/>
  <text x="826" y="312" fill="#7dd3fc" font-size="10" font-weight="600">Plan: Retune to clear backup channel:</text>
  <text x="826" y="326" fill="#38bdf8" font-size="10" font-weight="700" class="mono">548.750 MHz (Intermodulation Clear)</text>

  <rect x="816" y="344" width="328" height="34" rx="6" fill="#10b981"/>
  <text x="980" y="365" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">⚡ Apply AI Recommended Fix</text>

  <!-- Report Card 2: Resolved -->
  <rect x="800" y="405" width="360" height="135" rx="8" fill="#090d16" stroke="#26334d"/>
  <rect x="816" y="419" width="126" height="20" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
  <text x="879" y="433" fill="#10b981" font-size="10" font-weight="800" text-anchor="middle">AUDIO_CLIPPING</text>
  <text x="1144" y="433" fill="#64748b" font-size="10" text-anchor="end">AI Confidence: 98%</text>

  <text x="816" y="458" fill="#94a3b8" font-size="11">Sound Pressure Level exceeded ADC headroom.</text>
  <text x="816" y="474" fill="#94a3b8" font-size="11">Engaged internal -12 dB hardware pad.</text>

  <text x="816" y="515" fill="#10b981" font-size="11" font-weight="700">✓ Remediation Verified &amp; Applied</text>
</svg>
